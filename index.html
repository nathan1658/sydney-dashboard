<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sydney Live</title>
    <meta name="description" content="A realtime 3D dashboard of Sydney's weather and public transport, built on open government data." />
    <meta name="theme-color" content="#efe8db" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23efe8db'/%3E%3Crect x='7' y='12' width='5' height='13' fill='%23d6c09c'/%3E%3Crect x='14' y='6' width='5' height='19' fill='%23c9ad80'/%3E%3Crect x='21' y='15' width='4' height='10' fill='%23d6c09c'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23f6891f'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet" />
  </head>
  <body data-tab="weather">
    <div id="map"></div>
    <canvas id="deck"></canvas>

    <header class="masthead">
      <h1>Sydney <span>live</span></h1>
      <a class="source" href="https://github.com/nathan1658/sydney-dashboard" target="_blank" rel="noopener" aria-label="Source code on GitHub" title="Source code on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <p><time id="clock"></time> <span id="conn" class="conn">Connecting</span></p>
    </header>

    <nav class="tabs" aria-label="Panels">
      <button data-tab="weather" aria-selected="true">Weather</button>
      <button data-tab="transport" aria-selected="false">Transport</button>
    </nav>

    <aside class="rail rail-weather" aria-label="Weather">
      <section id="now" class="now"><p class="quiet">Reading the Bureau of Meteorology…</p></section>
      <section id="forecast" class="forecast"></section>
      <section id="warnings" class="warnings"></section>
    </aside>

    <aside class="rail rail-transport" aria-label="Public transport">
      <section id="modes" class="modes"><p class="quiet">Connecting to Transport for NSW…</p></section>
      <section id="alerts" class="alerts"></section>
    </aside>

    <footer class="dock">
      <div class="group" role="group" aria-label="Camera">
        <button data-view="city">City</button>
        <button data-view="harbour">Harbour</button>
        <button data-view="sydney">Greater Sydney</button>
      </div>
      <div class="group" role="group" aria-label="Layers">
        <button id="radar-toggle" aria-pressed="true">Rain radar <time id="radar-time"></time></button>
        <button id="stations-toggle" aria-pressed="true">Temperatures</button>
      </div>
      <details id="feeds" class="feeds"><summary>Feeds</summary></details>
      <p class="credits">
        Unofficial. <a href="https://github.com/nathan1658/sydney-dashboard" target="_blank" rel="noopener">Source on GitHub</a>. Data:
        <a href="https://www.bom.gov.au/other/copyright.shtml" target="_blank" rel="noopener">Bureau of Meteorology</a>,
        <a href="https://opendata.transport.nsw.gov.au" target="_blank" rel="noopener">Transport for NSW</a> (CC BY 4.0).
        Map: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>,
        <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>.
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
